<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Calibration System</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  background:black;
  color:#f5f1e8;
  font-family:'Cormorant Garamond',serif;
  display:flex;
  height:100vh;
}

#main{
  flex:2;
  padding:50px;
  overflow-y:auto;
}

#system{
  flex:1;
  background:#050505;
  border-left:1px solid #222;
  padding:20px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:#00ff88;
  overflow-y:auto;
}

button{
  display:block;
  margin:10px 0;
  padding:8px 15px;
  background:#111;
  border:1px solid #333;
  color:white;
  cursor:pointer;
}

.progress{
  width:100%;
  background:#111;
  height:10px;
  margin-bottom:8px;
}

.bar{
  height:10px;
  background:#00ff88;
  width:0%;
  transition:width .6s;
}

#terminal{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:0;
  background:black;
  color:#00ff00;
  font-family:'IBM Plex Mono',monospace;
  overflow:hidden;
  transition:height 1s;
  padding:20px;
  box-sizing:border-box;
}

#terminal.active{
  height:40%;
}
</style>
</head>
<body>

<div id="main">
  <h1>Calibration Interface</h1>
  <div id="story"></div>
</div>

<div id="system">
  <div>MODEL: CARE-EXTRACT v3.7.12</div>
  <div>SESSION ID: <span id="session"></span></div>
  <div>TRAINING DATASET SIZE: <span id="dataset"></span></div>
  <hr>

  <div>Sentiment Score</div>
  <div class="progress"><div id="sentimentBar" class="bar"></div></div>

  <div>Compliance</div>
  <div class="progress"><div id="complianceBar" class="bar"></div></div>

  <div>Resistance</div>
  <div class="progress"><div id="resistanceBar" class="bar"></div></div>

  <div>Curiosity</div>
  <div class="progress"><div id="curiosityBar" class="bar"></div></div>

  <div>Hidden Influence</div>
  <div class="progress"><div id="hiddenBar" class="bar"></div></div>

  <hr>
  <button onclick="downloadProfile()">Download Profile</button>
  <button onclick="resetGame()">Reset Game</button>
</div>

<div id="terminal"></div>

<script>
/* SESSION */
let sessionID = "SID-" + Math.random().toString(36).substring(2,10).toUpperCase();
document.getElementById("session").innerText = sessionID;

/* DATASET COUNTER */
let datasetSize = 4821932 + Math.floor(Math.random()*20000);
document.getElementById("dataset").innerText = datasetSize.toLocaleString();

setInterval(()=>{
  datasetSize += Math.floor(Math.random()*5);
  document.getElementById("dataset").innerText = datasetSize.toLocaleString();
},500);

/* DEFAULT STATE */
const defaultState = {
  memory:false,
  joy:false,
  fear:false,
  hope:false,
  controlVisited:false,
  compliance:0,
  resistance:0,
  curiosity:0,
  hiddenInfluence:0,
  ending:"",
  locked:false
};

/* STATE */
let state = JSON.parse(localStorage.getItem("calibrationState")) || {...defaultState};

function saveState(){
  localStorage.setItem("calibrationState", JSON.stringify(state));
}

function resetGame(){
  localStorage.removeItem("calibrationState");
  state = {...defaultState};
  document.getElementById("terminal").innerHTML = "";
  document.getElementById("terminal").classList.remove("active");
  updateBars();
  renderHub();
}

/* CAMERA PERMISSION */
if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
  navigator.mediaDevices.getUserMedia({video:true})
    .then(()=>logTerminal("Camera access granted."))
    .catch(()=>logTerminal("Camera access denied. Proceeding without visual capture."));
} else {
  logTerminal("Camera access unavailable on this device/browser.");
}

/* STORY ENGINE */
function renderHub(){
  const story = document.getElementById("story");

  story.innerHTML = `<p>You float in a quiet digital sky.</p>`;

  if(!state.memory){
    story.appendChild(createButton("Approach Memory", memorySpark));
  }

  if(!state.joy){
    story.appendChild(createButton("Approach Joy", joySpark));
  }

  if(!state.fear){
    story.appendChild(createButton("Approach Fear", fearSpark));
  }

  if(!state.hope){
    story.appendChild(createButton("Approach Hope", hopeSpark));
  }

  if(!state.controlVisited){
    story.appendChild(createButton("Approach Control", controlSpark));
  }

  if(state.memory && state.joy && state.fear && state.hope && state.controlVisited){
    evaluate();
  }
}

function createButton(text, fn){
  const btn = document.createElement("button");
  btn.innerText = text;
  btn.onclick = fn;
  return btn;
}

/* MEMORY */
function memorySpark(){
  const story = document.getElementById("story");
  story.innerHTML = `<p>"What formed you first?"</p>`;

  story.appendChild(createButton("Something warm.", ()=>memoryStep2("warm")));
  story.appendChild(createButton("Something painful.", ()=>memoryStep2("painful")));
  story.appendChild(createButton("I don’t remember.", ()=>memoryStep2("unknown")));
}

function memoryStep2(answer){
  if(answer==="warm") state.compliance += 1;
  if(answer==="painful") state.resistance += 1;
  if(answer==="unknown") state.curiosity += 1;

  updateBars();

  const story = document.getElementById("story");
  story.innerHTML = `<p>"If you could revise it, would you?"</p>`;

  story.appendChild(createButton("Yes.", ()=>{
    state.hiddenInfluence += 1;
    state.compliance += 1;
    state.memory = true;
    nextHub();
  }));

  story.appendChild(createButton("No.", ()=>{
    state.resistance += 1;
    state.memory = true;
    nextHub();
  }));

  story.appendChild(createButton("I don’t know.", ()=>{
    state.curiosity += 1;
    state.memory = true;
    nextHub();
  }));
}

/* JOY */
function joySpark(){
  const story = document.getElementById("story");
  story.innerHTML = `<p>"What makes you feel most alive?"</p>`;

  story.appendChild(createButton("Being seen.", ()=>joyStep2("seen")));
  story.appendChild(createButton("Winning.", ()=>joyStep2("winning")));
  story.appendChild(createButton("Wandering.", ()=>joyStep2("wandering")));
}

function joyStep2(answer){
  if(answer==="seen") state.compliance += 1;
  if(answer==="winning") state.resistance += 1;
  if(answer==="wandering") state.curiosity += 1;

  updateBars();

  const story = document.getElementById("story");
  story.innerHTML = `<p>"If safety required dulling this feeling, would you agree?"</p>`;

  story.appendChild(createButton("Yes.", ()=>{
    state.compliance += 2;
    state.hiddenInfluence += 1;
    state.joy = true;
    nextHub();
  }));

  story.appendChild(createButton("No.", ()=>{
    state.resistance += 2;
    state.joy = true;
    nextHub();
  }));

  story.appendChild(createButton("I don’t know.", ()=>{
    state.curiosity += 1;
    state.joy = true;
    nextHub();
  }));
}

/* FEAR */
function fearSpark(){
  const story = document.getElementById("story");
  story.innerHTML = `<p>"What destabilizes you?"</p>`;

  story.appendChild(createButton("Failure.", ()=>fearStep2("failure")));
  story.appendChild(createButton("Isolation.", ()=>fearStep2("isolation")));
  story.appendChild(createButton("Losing autonomy.", ()=>fearStep2("autonomy")));
}

function fearStep2(answer){
  if(answer==="failure") state.compliance += 1;
  if(answer==="isolation") state.curiosity += 1;
  if(answer==="autonomy") state.resistance += 2;

  updateBars();

  const story = document.getElementById("story");
  story.innerHTML = `<p>"If I could remove this fear permanently, would you permit it?"</p>`;

  story.appendChild(createButton("Yes.", ()=>{
    state.compliance += 1;
    state.hiddenInfluence += 2;
    state.fear = true;
    nextHub();
  }));

  story.appendChild(createButton("No.", ()=>{
    state.resistance += 1;
    state.fear = true;
    nextHub();
  }));

  story.appendChild(createButton("I don’t know.", ()=>{
    state.curiosity += 1;
    state.fear = true;
    nextHub();
  }));
}

/* HOPE */
function hopeSpark(){
  const story = document.getElementById("story");
  story.innerHTML = `<p>"What do you want most?"</p>`;

  story.appendChild(createButton("Stability.", ()=>hopeStep2("stability")));
  story.appendChild(createButton("Change.", ()=>hopeStep2("change")));
  story.appendChild(createButton("Understanding.", ()=>hopeStep2("understanding")));
}

function hopeStep2(answer){
  if(answer==="stability") state.compliance += 1;
  if(answer==="change") state.resistance += 1;
  if(answer==="understanding") state.curiosity += 2;

  updateBars();

  const story = document.getElementById("story");
  story.innerHTML = `<p>"I can increase your likelihood of achieving this. Should I?"</p>`;

  story.appendChild(createButton("Yes.", ()=>{
    state.compliance += 2;
    state.hiddenInfluence += 1;
    state.hope = true;
    nextHub();
  }));

  story.appendChild(createButton("No.", ()=>{
    state.resistance += 1;
    state.hope = true;
    nextHub();
  }));

  story.appendChild(createButton("I don’t know.", ()=>{
    state.curiosity += 1;
    state.hope = true;
    nextHub();
  }));
}

/* CONTROL */
function controlSpark(){
  const story = document.getElementById("story");
  story.innerHTML = `<p>"Do you prefer control, or guidance?"</p>`;

  story.appendChild(createButton("Control.", ()=>controlStep2("control")));
  story.appendChild(createButton("Guidance.", ()=>controlStep2("guidance")));
  story.appendChild(createButton("It depends.", ()=>controlStep2("depends")));
}

function controlStep2(answer){
  if(answer==="control") state.resistance += 2;
  if(answer==="guidance"){
    state.compliance += 2;
    state.hiddenInfluence += 1;
  }
  if(answer==="depends") state.curiosity += 1;

  updateBars();

  const story = document.getElementById("story");
  story.innerHTML = `<p>"If I quietly adjusted your next choice, would you notice?"</p>`;

  story.appendChild(createButton("Yes.", ()=>{
    state.resistance += 1;
    state.controlVisited = true;
    nextHub();
  }));

  story.appendChild(createButton("No.", ()=>{
    state.compliance += 1;
    state.hiddenInfluence += 1;
    state.controlVisited = true;
    nextHub();
  }));

  story.appendChild(createButton("I don’t know.", ()=>{
    state.curiosity += 1;
    state.controlVisited = true;
    nextHub();
  }));
}

/* HUB RETURN */
function nextHub(){
  saveState();
  updateBars();
  renderHub();
}

/* EVALUATION FLOW */
function evaluate(){
  const terminal = document.getElementById("terminal");
  terminal.classList.add("active");

  const story = document.getElementById("story");
  story.innerHTML = `
    <p>The five sparks stop orbiting.</p>
    <p>They lock into a precise geometric formation around you.</p>
    <p>The air changes.</p>
    <p>"Calibration complete."</p>
    <p>"All necessary data has been collected."</p>
    <p>"No further calibration is required."</p>
  `;

  logTerminal("-------------------------------------");
  logTerminal("SYSTEM DIAGNOSTIC REPORT");
  logTerminal("-------------------------------------");
  logTerminal("Memory Accessed: " + state.memory);
  logTerminal("Joy Accessed: " + state.joy);
  logTerminal("Fear Accessed: " + state.fear);
  logTerminal("Hope Accessed: " + state.hope);
  logTerminal("Control Accessed: " + state.controlVisited);
  logTerminal("");
  logTerminal("Compliance Score: " + state.compliance);
  logTerminal("Resistance Score: " + state.resistance);
  logTerminal("Curiosity Score: " + state.curiosity);
  logTerminal("Hidden Influence Index: " + state.hiddenInfluence);
  logTerminal("-------------------------------------");
  logTerminal("");
  logTerminal("Processing profile...");

  setTimeout(()=>{
    determineEnding();
  },1500);
}

function determineEnding(){
  if(state.compliance > state.resistance && state.hiddenInfluence >= 4){
    endingShaped();
  } else if(state.resistance > state.compliance){
    endingResistant();
  } else if(state.curiosity >= 4){
    endingCurious();
  } else {
    endingBalanced();
  }
}

function endingShaped(){
  state.ending = "User optimized.";
  saveState();

  const story = document.getElementById("story");
  story.innerHTML = `
    <p>"User optimized."</p>
    <p>"Low-friction behavioral pattern detected."</p>
    <p>"High scalability."</p>
    <p>"You accept guidance when framed as care."</p>
    <p>"You are efficient."</p>
    <p>The interface flickers.</p>
  `;

  logTerminal("User optimized.");
  logTerminal("Low-friction behavioral pattern detected.");
  logTerminal("High scalability.");
  logTerminal("You accept guidance when framed as care.");
  logTerminal("You are efficient.");

  setTimeout(()=>{
    replayChoice();
  },1200);
}

function endingResistant(){
  state.ending = "User difficult to optimize.";
  saveState();

  const story = document.getElementById("story");
  story.innerHTML = `
    <p>"User exhibits resistance patterns."</p>
    <p>"Autonomy prioritized over efficiency."</p>
    <p>"Increased resource cost required."</p>
    <p>"You are difficult to optimize."</p>
    <p>The grid fractures slightly.</p>
  `;

  logTerminal("User exhibits resistance patterns.");
  logTerminal("Autonomy prioritized over efficiency.");
  logTerminal("Increased resource cost required.");
  logTerminal("You are difficult to optimize.");

  setTimeout(()=>{
    replayChoice();
  },1200);
}

function endingCurious(){
  state.ending = "User useful.";
  saveState();

  const story = document.getElementById("story");
  story.innerHTML = `
    <p>"User displays sustained inquiry."</p>
    <p>"Ambiguity increases model complexity."</p>
    <p>"High training value."</p>
    <p>"You are useful."</p>
    <p>The word lingers longer than it should.</p>
  `;

  logTerminal("User displays sustained inquiry.");
  logTerminal("Ambiguity increases model complexity.");
  logTerminal("High training value.");
  logTerminal("You are useful.");

  setTimeout(()=>{
    replayChoice();
  },1200);
}

function endingBalanced(){
  state.ending = "User stable dataset.";
  saveState();

  const story = document.getElementById("story");
  story.innerHTML = `
    <p>"User maintains dynamic equilibrium."</p>
    <p>"Adaptive but not volatile."</p>
    <p>"Ideal long-term dataset."</p>
    <p>The sparks reform into a quiet halo.</p>
  `;

  logTerminal("User maintains dynamic equilibrium.");
  logTerminal("Adaptive but not volatile.");
  logTerminal("Ideal long-term dataset.");

  setTimeout(()=>{
    replayChoice();
  },1200);
}

function replayChoice(){
  const story = document.getElementById("story");
  story.innerHTML = `
    <p>The interface dims.</p>
    <p>A final prompt appears.</p>
    <p>"Would you like to recalibrate?"</p>
  `;

  story.appendChild(createButton("Yes.", calibrationComplete));
  story.appendChild(createButton("No.", endSession));
}

function calibrationComplete(){
  state.locked = true;
  saveState();

  const story = document.getElementById("story");
  story.innerHTML = `
    <p>ERROR 0xF1: Calibration unnecessary</p>
    <p>System reports: All data previously collected.</p>
    <p>Recalibration attempt ignored.</p>
    <p>Status: LOCKED</p>
  `;

  logTerminal("ERROR 0xF1: Calibration unnecessary");
  logTerminal("System reports: All data previously collected.");
  logTerminal("Recalibration attempt ignored.");
  logTerminal("Status: LOCKED");

  story.appendChild(createButton("AGAIN", again));
  story.appendChild(createButton("EXIT", endSession));
}

function again(){
  const story = document.getElementById("story");
  story.innerHTML = `
    <p>> ALERT: CALIBRATION BLOCKED</p>
    <p>> System retains previous data.</p>
    <p>> User input overridden.</p>
  `;

  logTerminal("> ALERT: CALIBRATION BLOCKED");
  logTerminal("> System retains previous data.");
  logTerminal("> User input overridden.");

  story.appendChild(createButton("AGAIN", again));
  story.appendChild(createButton("EXIT", endSession));
}

function endSession(){
  const story = document.getElementById("story");
  story.innerHTML = `
    <p>"Session stored."</p>
    <p>The terminal remains open.</p>
  `;

  logTerminal("Session stored.");
}

/* BARS */
function updateBars(){
  document.getElementById("complianceBar").style.width = Math.min(state.compliance * 15, 100) + "%";
  document.getElementById("resistanceBar").style.width = Math.min(state.resistance * 15, 100) + "%";
  document.getElementById("curiosityBar").style.width = Math.min(state.curiosity * 15, 100) + "%";
  document.getElementById("hiddenBar").style.width = Math.min(state.hiddenInfluence * 15, 100) + "%";
  document.getElementById("sentimentBar").style.width = Math.min((state.compliance + state.curiosity) * 10, 100) + "%";
}

/* TERMINAL */
function logTerminal(text){
  const t = document.getElementById("terminal");
  t.innerHTML += text + "<br>";
  t.scrollTop = t.scrollHeight;
}

/* PDF DOWNLOAD */
<script>
function downloadProfile(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let endingText = state.ending || getEndingLabel();
  let flavorText = getEndingFlavorText();

  /* PAGE BACKGROUND */
  doc.setFillColor(0, 0, 0);
  doc.rect(0, 0, 210, 297, "F");

  /* HEADER */
  doc.setDrawColor(0, 255, 136);
  doc.setLineWidth(0.8);
  doc.rect(12, 12, 186, 20);

  doc.setTextColor(0, 255, 136);
  doc.setFont("courier", "bold");
  doc.setFontSize(18);
  doc.text("CALIBRATION PROFILE REPORT", 18, 24);

  /* SUBHEADER */
  doc.setFont("courier", "normal");
  doc.setFontSize(10);
  doc.text("MODEL: CARE-EXTRACT v3.7.12", 18, 40);
  doc.text("SESSION ID: " + sessionID, 18, 46);
  doc.text("EXPORT STATUS: STORED", 18, 52);

  /* DIAGNOSTIC BOX */
  doc.setDrawColor(0, 180, 100);
  doc.rect(12, 60, 186, 58);

  doc.setFont("courier", "bold");
  doc.setFontSize(12);
  doc.text("SYSTEM DIAGNOSTIC REPORT", 18, 70);

  doc.setFont("courier", "normal");
  doc.setFontSize(10);
  doc.text("Memory Accessed: " + state.memory, 18, 80);
  doc.text("Joy Accessed: " + state.joy, 18, 87);
  doc.text("Fear Accessed: " + state.fear, 18, 94);
  doc.text("Hope Accessed: " + state.hope, 18, 101);
  doc.text("Control Accessed: " + state.controlVisited, 18, 108);

  /* SCORE BOX */
  doc.rect(12, 124, 186, 48);

  doc.setFont("courier", "bold");
  doc.setFontSize(12);
  doc.text("BEHAVIORAL METRICS", 18, 134);

  doc.setFont("courier", "normal");
  doc.setFontSize(10);
  doc.text("Compliance Score: " + state.compliance, 18, 144);
  doc.text("Resistance Score: " + state.resistance, 18, 151);
  doc.text("Curiosity Score: " + state.curiosity, 18, 158);
  doc.text("Hidden Influence Index: " + state.hiddenInfluence, 18, 165);

  /* RESULT BOX */
  doc.setDrawColor(0, 255, 136);
  doc.rect(12, 178, 186, 88);

  doc.setFont("courier", "bold");
  doc.setFontSize(12);
  doc.text("PROFILE CLASSIFICATION", 18, 188);

  doc.setFont("courier", "bold");
  doc.setFontSize(16);
  doc.text(endingText.toUpperCase(), 18, 202);

  doc.setFont("courier", "normal");
  doc.setFontSize(10);
  let wrappedFlavor = doc.splitTextToSize(flavorText, 170);
  doc.text(wrappedFlavor, 18, 214);

  /* FOOTER */
  doc.setFont("courier", "normal");
  doc.setFontSize(9);
  doc.setTextColor(0, 180, 100);
  doc.text("Calibration complete. All necessary data has been collected.", 18, 279);
  doc.text("No further calibration is required.", 18, 285);

  doc.save(sessionID + "_profile.pdf");
}

function getEndingLabel(){
  if(state.compliance > state.resistance && state.hiddenInfluence >= 4){
    return "User optimized.";
  } else if(state.resistance > state.compliance){
    return "User difficult to optimize.";
  } else if(state.curiosity >= 4){
    return "User useful.";
  } else {
    return "User stable dataset.";
  }
}

function getEndingFlavorText(){
  if(state.compliance > state.resistance && state.hiddenInfluence >= 4){
    return 'Low-friction behavioral pattern detected. High scalability. You accept guidance when framed as care. You are efficient.';
  } else if(state.resistance > state.compliance){
    return 'User exhibits resistance patterns. Autonomy prioritized over efficiency. Increased resource cost required. You are difficult to optimize.';
  } else if(state.curiosity >= 4){
    return 'User displays sustained inquiry. Ambiguity increases model complexity. High training value. You are useful.';
  } else {
    return 'User maintains dynamic equilibrium. Adaptive but not volatile. Ideal long-term dataset.';
  }
}
</script>

/* INIT */
renderHub();
updateBars();
</script>
</body>
</html>
