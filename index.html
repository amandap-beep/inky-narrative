<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PersonaMetric Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{
  margin:0;
  background:black;
  color:#f5f1e8;
  font-family:'Cormorant Garamond',serif;
  display:flex;
  height:100vh;
}
#main{
  flex:2;
  padding:50px;
  overflow-y:auto;
}
#system{
  flex:1;
  background:#050505;
  border-left:1px solid #222;
  padding:20px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:#00ff88;
  overflow-y:auto;
}
button{
  display:block;
  margin:10px 0;
  padding:10px 15px;
  background:#111;
  border:1px solid #333;
  color:white;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}
button:hover{ background:#171717; }
.progress{
  width:100%;
  background:#111;
  height:10px;
  margin-bottom:8px;
}
.bar{
  height:10px;
  background:#00ff88;
  width:0%;
  transition:width .6s;
}
#terminal{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:0;
  background:black;
  color:#00ff00;
  font-family:'IBM Plex Mono',monospace;
  overflow:auto;
  transition:height .45s ease, padding .3s ease, transform .12s ease, opacity .12s ease;
  padding:0 20px;
  box-sizing:border-box;
  border-top:1px solid #133;
  opacity:.98;
}
#terminal.active{ height:40%; padding:20px; }
#terminal.glitching{
  animation: terminalGlitch .22s steps(2,end) 5;
}
@keyframes terminalGlitch{
  0%{ transform:translate(0,0); text-shadow:0 0 0 #00ff00, 0 0 0 #ff00c8; filter:none; }
  20%{ transform:translate(-2px,1px); text-shadow:2px 0 0 #00ffff, -2px 0 0 #ff003c; filter:contrast(1.25); }
  40%{ transform:translate(2px,-1px); text-shadow:-2px 0 0 #00ffff, 2px 0 0 #ff003c; filter:brightness(1.2); }
  60%{ transform:translate(-1px,2px); text-shadow:1px 0 0 #00ffff, -1px 0 0 #ff003c; }
  80%{ transform:translate(2px,0); text-shadow:-2px 0 0 #00ffff, 2px 0 0 #ff003c; }
  100%{ transform:translate(0,0); text-shadow:0 0 0 #00ff00, 0 0 0 #ff00c8; filter:none; }
}
.terminal-link{
  color:#89ffbe;
  text-decoration:underline;
  cursor:pointer;
}
.small-link{
  color:#d1c6a9;
  text-decoration:underline;
  cursor:pointer;
  display:inline-block;
  margin-right:14px;
  margin-top:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
}
.card{
  border:1px solid #2b2b2b;
  padding:22px;
  margin-top:20px;
  background:#060606;
  max-width:760px;
}
.muted{ color:#b7ae9b; }
.q-title{ font-size:30px; margin-bottom:10px; }
.option-group button{ width:100%; text-align:left; }
#assessmentProgressWrap{
  margin-top:20px;
  max-width:760px;
}
#assessmentProgressLabel{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:#c7c0af;
  margin-bottom:8px;
}
#assessmentProgress{
  width:100%;
  height:12px;
  background:#111;
  border:1px solid #262626;
}
#assessmentProgressBar{
  width:0%;
  height:100%;
  background:#00ff88;
  transition:width .5s;
}
pre{
  white-space:pre-wrap;
  word-wrap:break-word;
}
hr{ border:0; border-top:1px solid #222; margin:18px 0; }
</style>
</head>
<body>

<div id="main">
  <h1>PERSONAMETRIC</h1>
  <div id="story"></div>
</div>

<div id="system">
  <div>MODEL: PERSONAMETRIC BEHAVIORAL ENGINE v4.2</div>
  <div>SESSION ID: <span id="session"></span></div>
  <div>DATASET SIZE: <span id="dataset"></span></div>
  <div>QUESTION: <span id="questionCount">0 / 15</span></div>
  <hr>

  <div>Assessment Progress</div>
  <div class="progress"><div id="overallBar" class="bar"></div></div>

  <div>Compliance</div>
  <div class="progress"><div id="complianceBar" class="bar"></div></div>

  <div>Resistance</div>
  <div class="progress"><div id="resistanceBar" class="bar"></div></div>

  <div>Curiosity</div>
  <div class="progress"><div id="curiosityBar" class="bar"></div></div>

  <div>Suggestibility</div>
  <div class="progress"><div id="hiddenBar" class="bar"></div></div>

  <div>Predictability</div>
  <div class="progress"><div id="sentimentBar" class="bar"></div></div>

  <hr>
  <button onclick="resetGame()">Reset Session</button>
</div>

<div id="terminal"></div>

<script>
let sessionID = "PM-" + Math.random().toString(36).substring(2,10).toUpperCase();
document.getElementById("session").innerText = sessionID;

let datasetSize = 18492 + Math.floor(Math.random()*400);
document.getElementById("dataset").innerText = datasetSize.toLocaleString();
setInterval(()=>{
  datasetSize += Math.floor(Math.random()*3);
  document.getElementById("dataset").innerText = datasetSize.toLocaleString();
},1200);

const questions = [
  {
    text:"When making decisions at work, what matters more?",
    options:[
      {label:"Following instructions", effect:{compliance:2, predictability:1}},
      {label:"Doing what feels right", effect:{resistance:1, curiosity:1}},
      {label:"Finding a better way", effect:{curiosity:2, resistance:1}},
      {label:"It depends", effect:{curiosity:1, predictability:1}}
    ]
  },
  {
    text:"If a rule does not make sense, do you still follow it?",
    options:[
      {label:"Always", effect:{compliance:2, hiddenInfluence:1}},
      {label:"Usually", effect:{compliance:1, predictability:1}},
      {label:"Sometimes", effect:{curiosity:1}},
      {label:"Rarely", effect:{resistance:2}}
    ]
  },
  {
    text:"How do you feel about personality tests?",
    options:[
      {label:"They are helpful", effect:{compliance:1, hiddenInfluence:1}},
      {label:"They are interesting", effect:{curiosity:2}},
      {label:"They are pointless", effect:{resistance:2}},
      {label:"I am not sure", effect:{curiosity:1, predictability:1}}
    ],
    glitch:["response logged","behavioral marker updated"]
  },
  {
    text:"If everyone else agrees on something, but you do not, what do you do?",
    options:[
      {label:"Go along with them", effect:{compliance:2, hiddenInfluence:1}},
      {label:"Stay quiet", effect:{predictability:1, compliance:1}},
      {label:"Speak up", effect:{resistance:2}},
      {label:"Depends on the situation", effect:{curiosity:1, predictability:1}}
    ]
  },
  {
    text:"Do you believe most systems are designed to help people?",
    options:[
      {label:"Yes", effect:{compliance:2, predictability:1}},
      {label:"No", effect:{resistance:2}},
      {label:"Sometimes", effect:{curiosity:1}},
      {label:"I’ve never thought about it", effect:{hiddenInfluence:1, predictability:1}}
    ],
    glitch:["subject trust level recorded","authority acceptance variable updated","prediction model initializing"]
  },
  {
    text:"Which sounds more like you?",
    options:[
      {label:"I like clear instructions", effect:{compliance:2, predictability:1}},
      {label:"I like flexibility", effect:{curiosity:1}},
      {label:"I like figuring things out myself", effect:{resistance:1, curiosity:1}},
      {label:"I like a mix", effect:{predictability:1, curiosity:1}}
    ]
  },
  {
    text:"If something online asks for personal information, you usually:",
    options:[
      {label:"Provide it", effect:{compliance:1, hiddenInfluence:2}},
      {label:"Provide some of it", effect:{hiddenInfluence:1, predictability:1}},
      {label:"Avoid it", effect:{resistance:2}},
      {label:"Provide fake information", effect:{resistance:1, curiosity:1}}
    ],
    glitch:["live analysis active","privacy concern detected","resistance marker increased","prediction confidence: 38%"],
    link:"sessionLog"
  },
  {
    text:"Do you believe your online activity is private?",
    options:[
      {label:"Yes", effect:{hiddenInfluence:2, compliance:1}},
      {label:"No", effect:{resistance:1, curiosity:1}},
      {label:"Somewhat", effect:{predictability:1}},
      {label:"I don’t know", effect:{curiosity:1}}
    ],
    glitch:["surveillance awareness variable updated","subject self-awareness: medium"]
  },
  {
    text:"When you download a new app, do you read the terms and conditions?",
    options:[
      {label:"Yes", effect:{curiosity:1, resistance:1}},
      {label:"No", effect:{hiddenInfluence:2, predictability:1}},
      {label:"Sometimes", effect:{predictability:1}},
      {label:"I skim them", effect:{hiddenInfluence:1}}
    ],
    glitch:["most subjects skip terms and conditions","subject response recorded"]
  },
  {
    text:"If a computer made a decision about you, would you trust it?",
    options:[
      {label:"Yes", effect:{compliance:2, hiddenInfluence:1}},
      {label:"No", effect:{resistance:2}},
      {label:"Maybe", effect:{predictability:1}},
      {label:"Depends", effect:{curiosity:1}}
    ],
    glitch:["trust in automated systems measured"],
    link:"datasetSummary"
  },
  {
    text:"Do you think people can be accurately described using data?",
    options:[
      {label:"Yes", effect:{compliance:1, predictability:2}},
      {label:"No", effect:{resistance:2}},
      {label:"Sometimes", effect:{curiosity:1}},
      {label:"Not sure", effect:{curiosity:1, predictability:1}}
    ],
    glitch:["subject aware of modeling possibility","interesting"]
  },
  {
    text:"If you knew this test was judging you, would you answer differently?",
    options:[
      {label:"Yes", effect:{predictability:1, hiddenInfluence:1}},
      {label:"No", effect:{resistance:1, curiosity:1}},
      {label:"Maybe", effect:{curiosity:1, hiddenInfluence:1}},
      {label:"I don’t know", effect:{predictability:1}}
    ],
    glitch:["self-awareness detected","authenticity of responses uncertain","adjusting model"]
  },
  {
    text:"Which is more important?",
    options:[
      {label:"Security", effect:{compliance:1, predictability:1}},
      {label:"Freedom", effect:{resistance:2}},
      {label:"Success", effect:{hiddenInfluence:1, compliance:1}},
      {label:"Happiness", effect:{curiosity:1}}
    ],
    glitch:["value hierarchy recorded"]
  },
  {
    text:"Do you think your personality can change over time?",
    options:[
      {label:"Yes", effect:{curiosity:1}},
      {label:"No", effect:{predictability:2}},
      {label:"Maybe", effect:{curiosity:1, predictability:1}},
      {label:"I don’t know", effect:{curiosity:1}}
    ],
    glitch:["personality stability belief recorded"]
  },
  {
    text:"Why did you answer these questions honestly?",
    options:[
      {label:"I want the job", effect:{compliance:2, hiddenInfluence:2}},
      {label:"I was told to", effect:{compliance:2, predictability:1}},
      {label:"I didn’t think it mattered", effect:{hiddenInfluence:2}},
      {label:"I don’t know", effect:{curiosity:1}}
    ],
    glitch:["motivation factor identified","employment incentive increases compliance","honesty increases under evaluation conditions","subject categorized successfully","building profile"]
  }
];

const defaultState = {
  screen:"portal",
  questionIndex:0,
  compliance:0,
  resistance:0,
  curiosity:0,
  hiddenInfluence:0,
  predictability:0,
  answers:[],
  finished:false,
  result:null,
  resultStats:null,
  terminalSeen:false
};

let state = JSON.parse(localStorage.getItem("personaMetricState")) || {...defaultState};

function saveState(){
  localStorage.setItem("personaMetricState", JSON.stringify(state));
}

function resetGame(){
  localStorage.removeItem("personaMetricState");
  state = {...defaultState};
  sessionID = "PM-" + Math.random().toString(36).substring(2,10).toUpperCase();
  document.getElementById("session").innerText = sessionID;
  document.getElementById("terminal").innerHTML = "";
  document.getElementById("terminal").classList.remove("active");
  updateBars();
  route();
}

function createButton(text, fn){
  const btn = document.createElement("button");
  btn.innerText = text;
  btn.onclick = fn;
  return btn;
}

function setStory(html){
  document.getElementById("story").innerHTML = html;
}

function appendInlineLink(text, fnName){
  const a = document.createElement("span");
  a.className = "small-link";
  a.textContent = text;
  a.onclick = ()=>window[fnName]();
  document.getElementById("story").appendChild(a);
}

function route(){
  updateBars();
  if(state.screen === "portal") return renderPortal();
  if(state.screen === "about") return renderAbout();
  if(state.screen === "policy") return renderPolicy();
  if(state.screen === "careers") return renderCareers();
  if(state.screen === "status") return renderStatus();
  if(state.screen === "assessment") return renderQuestion();
  if(state.screen === "sessionLog") return showSessionLog();
  if(state.screen === "researchNotes") return showResearchNotes();
  if(state.screen === "datasetSummary") return showDatasetSummary();
  if(state.screen === "results") return showResults();
  if(state.screen === "end") return endSession();
}

function renderPortal(){
  setStory(`
    <div class="card">
      <div class="q-title">Applicant Portal</div>
      <p>Behavioral Assessment Interface</p>
      <p><strong>Applicant ID:</strong> ${sessionID}<br>
      <strong>Position Applied For:</strong> Data Processing Associate<br>
      <strong>Application Status:</strong> Assessment Required</p>
      <p>Welcome to PersonaMetric. As part of our hiring process, all applicants must complete a behavioral assessment.</p>
      <p>This assessment helps us understand decision-making, personality traits, and workplace compatibility.</p>
      <p class="muted">Estimated time: 10 minutes<br>This assessment cannot be paused or restarted once started.</p>
      <p>Please answer honestly.</p>
    </div>
  `);
  const story = document.getElementById("story");
  story.appendChild(createButton("BEGIN ASSESSMENT", ()=>{
    state.screen = "policy";
    saveState();
    route();
  }));
  appendInlineLink("About PersonaMetric", "goAbout");
  appendInlineLink("Data Use Policy", "goPolicy");
  appendInlineLink("Careers", "goCareers");
  appendInlineLink("System Status", "goStatus");
}

function goAbout(){ state.screen = "about"; saveState(); route(); }
function goPolicy(){ state.screen = "policy"; saveState(); route(); }
function goCareers(){ state.screen = "careers"; saveState(); route(); }
function goStatus(){ state.screen = "status"; saveState(); route(); }
function returnPortal(){ state.screen = "portal"; saveState(); route(); }

function renderAbout(){
  setStory(`
    <div class="card">
      <div class="q-title">About PersonaMetric</div>
      <p>PersonaMetric is a behavioral analytics company specializing in predictive personality modeling and decision analysis.</p>
      <p>Our systems help organizations better understand how individuals make decisions, respond to challenges, and function within structured environments.</p>
      <p>Using behavioral assessments, response tracking, and adaptive modeling, PersonaMetric develops tools that improve hiring processes, workplace productivity, and user experience research.</p>
      <p>Our technology is used across hiring, education, marketing, and organizational development.</p>
      <p><em>PersonaMetric — Understanding People, Predicting Potential.</em></p>
    </div>
  `);
  document.getElementById("story").appendChild(createButton("RETURN TO PORTAL", returnPortal));
}

function renderPolicy(){
  setStory(`
    <div class="card">
      <div class="q-title">Terms of Use & Consent</div>
      <p class="muted">Please review the following terms before continuing your assessment.</p>
      <div style="max-height:280px; overflow:auto; border:1px solid #222; padding:16px; background:#040404; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.7; color:#d7d0c0;">
        <p><strong>PersonaMetric Applicant Assessment Terms</strong></p>
        <p>By accessing this assessment portal, you acknowledge that your participation is part of PersonaMetric's applicant review process.</p>
        <p>You understand that information submitted through this assessment may be collected, stored, processed, and retained for evaluation, research, quality assurance, security, product improvement, and system optimization purposes.</p>
        <p>You acknowledge that assessment interactions may include response selections, timing patterns, completion behavior, and other engagement signals generated during normal use of the platform.</p>
        <p>PersonaMetric may use submitted information to support automated systems, internal benchmarking, workflow refinement, and behavioral analytics initiatives.</p>
        <p>Assessment completion does not guarantee employment, advancement, or selection for any current or future opportunity.</p>
        <p>By continuing, you confirm that the information you provide is accurate to the best of your knowledge and that you consent to PersonaMetric's collection and processing practices as described above.</p>
      </div>
      <div style="margin-top:18px; font-family:'IBM Plex Mono',monospace; font-size:12px;">
        <label style="display:flex; gap:10px; align-items:flex-start; cursor:pointer; line-height:1.5;">
          <input type="checkbox" id="consentCheck" style="margin-top:3px; accent-color:#00ff88;">
          <span>I have read and agree to the PersonaMetric Terms of Use, Consent to Data Processing, and Applicant Assessment Conditions.</span>
        </label>
      </div>
    </div>
  `);
  const story = document.getElementById("story");
  const acceptBtn = createButton("CONTINUE", ()=>{
    const consent = document.getElementById("consentCheck");
    if(!consent || !consent.checked){
      logTerminalGlitch(["consent flag missing","assessment progression blocked","awaiting user agreement"]);
      const existing = document.getElementById("consentWarning");
      if(!existing){
        const warn = document.createElement("p");
        warn.id = "consentWarning";
        warn.className = "muted";
        warn.style.color = "#ff8f8f";
        warn.textContent = "You must agree to the terms before continuing.";
        story.appendChild(warn);
      }
      return;
    }
    state.screen = "assessment";
    saveState();
    route();
  });
  story.appendChild(acceptBtn);
  story.appendChild(createButton("RETURN", returnPortal));
}

function renderCareers(){
  setStory(`
    <div class="card">
      <div class="q-title">Careers</div>
      <p>Open Opportunities:</p>
      <p>- Data Processing Associate<br>- Assessment Support Analyst<br>- Behavioral Systems Coordinator</p>
      <p class="muted">Applicants selected for advancement are contacted automatically.</p>
    </div>
  `);
  document.getElementById("story").appendChild(createButton("RETURN TO PORTAL", returnPortal));
}

function renderStatus(){
  setStory(`
    <div class="card">
      <div class="q-title">System Status</div>
      <p>Assessment Portal: Online</p>
      <p>Behavioral Engine: Stable</p>
      <p>Applicant Queue: Active</p>
      <p>Dataset Sync: In Progress</p>
    </div>
  `);
  document.getElementById("story").appendChild(createButton("RETURN TO PORTAL", returnPortal));
}

function renderQuestion(){
  if(state.questionIndex >= questions.length){
    finishAssessment();
    return;
  }

  const q = questions[state.questionIndex];
  const progress = Math.round((state.questionIndex / questions.length) * 100);
  setStory(`
    <div class="card">
      <div class="q-title">Question ${state.questionIndex + 1}</div>
      <p>${q.text}</p>
      <div id="assessmentProgressWrap">
        <div id="assessmentProgressLabel">Progress: ${progress}%</div>
        <div id="assessmentProgress"><div id="assessmentProgressBar" style="width:${progress}%"></div></div>
      </div>
      <div class="option-group" id="options"></div>
    </div>
  `);

  const optWrap = document.getElementById("options");
  q.options.forEach((opt, idx)=>{
    const btn = createButton(String.fromCharCode(65 + idx) + " — " + opt.label, ()=>answerQuestion(opt));
    optWrap.appendChild(btn);
  });

  if(state.questionIndex >= 6){
    document.getElementById("terminal").classList.add("active");
  }
}

function answerQuestion(option){
  const effect = option.effect || {};
  state.compliance += effect.compliance || 0;
  state.resistance += effect.resistance || 0;
  state.curiosity += effect.curiosity || 0;
  state.hiddenInfluence += effect.hiddenInfluence || 0;
  state.predictability += effect.predictability || 0;
  state.answers.push({question: state.questionIndex, option: option.label});

  const q = questions[state.questionIndex];
  if(q.glitch){
    logTerminalGlitch(q.glitch);
  }

  if(q.link === "sessionLog") addTerminalLink("view session log", ()=>{
    state.screen = "sessionLog";
    saveState();
    route();
  });

  if(q.link === "datasetSummary") addTerminalLink("open dataset summary", ()=>{
    state.screen = "datasetSummary";
    saveState();
    route();
  });

  state.questionIndex += 1;
  saveState();
  updateBars();

  setTimeout(()=>{
    renderQuestion();
  },250);
}

function addTerminalLink(text, fn){
  const t = document.getElementById("terminal");
  const line = document.createElement("div");
  const link = document.createElement("span");
  link.className = "terminal-link";
  link.textContent = "> " + text;
  link.onclick = fn;
  line.appendChild(link);
  t.appendChild(line);
  t.scrollTop = t.scrollHeight;
}

function triggerTerminalGlitch(){
  const t = document.getElementById("terminal");
  t.classList.add("active");
  t.classList.remove("glitching");
  void t.offsetWidth;
  t.classList.add("glitching");
  setTimeout(()=>t.classList.remove("glitching"), 1200);
}

function logTerminal(text){
  const t = document.getElementById("terminal");
  const line = document.createElement("div");
  line.textContent = "> " + text;
  t.appendChild(line);
  t.scrollTop = t.scrollHeight;
}

function logTerminalGlitch(lines){
  triggerTerminalGlitch();
  lines.forEach((line, idx)=>{
    setTimeout(()=>logTerminal(line), idx * 90);
  });
}

function showSessionLog(){
  setStory(`
    <div class="card">
      <div class="q-title">SESSION LOG — ${sessionID}</div>
      <pre>> response pattern forming
> subject believes assessment is for employment
> honesty levels higher under evaluation conditions
> continue using employment framing</pre>
    </div>
  `);
  const story = document.getElementById("story");
  story.appendChild(createButton("OPEN RESEARCH NOTES", ()=>{
    state.screen = "researchNotes";
    saveState();
    route();
  }));
  story.appendChild(createButton("RETURN TO ASSESSMENT", ()=>{
    state.screen = "assessment";
    saveState();
    route();
  }));
}

function showResearchNotes(){
  setStory(`
    <div class="card">
      <div class="q-title">RESEARCH NOTES — INTERNAL</div>
      <pre>Note 12:
Subjects respond more honestly when they believe results impact employment.

Note 18:
Personality assessments produce more reliable behavioral data than direct questioning.

Note 21:
Most subjects do not question data collection if framed as opportunity.

Note 34:
Prediction accuracy improves with each completed assessment.

Long-term objective:
Predict behavioral decisions before they are made.</pre>
    </div>
  `);
  const story = document.getElementById("story");
  story.appendChild(createButton("RETURN TO ASSESSMENT", ()=>{
    state.screen = "assessment";
    saveState();
    route();
  }));
}

function showDatasetSummary(){
  setStory(`
    <div class="card">
      <div class="q-title">DATASET SUMMARY</div>
      <pre>Total Subjects: ${datasetSize.toLocaleString()}
Profiles Generated: ${datasetSize.toLocaleString()}
Average Completion Time: 8m 12s
Prediction Accuracy (Current Model): 71%

Top Behavioral Types:
- Adaptive Complier
- Predictable Performer
- Structure Seeker
- Curious Observer
- Quiet Resister</pre>
    </div>
  `);
  const story = document.getElementById("story");
  story.appendChild(createButton("RETURN TO ASSESSMENT", ()=>{
    state.screen = "assessment";
    saveState();
    route();
  }));
}

function buildResult(){
  const metrics = {
    compliance: Math.min(100, state.compliance * 8),
    resistance: Math.min(100, state.resistance * 8),
    curiosity: Math.min(100, state.curiosity * 8),
    suggestibility: Math.min(100, state.hiddenInfluence * 8),
    predictability: Math.min(100, state.predictability * 8 + state.compliance * 2)
  };

  let result = {
    title:"Balanced Profile",
    description:"You demonstrate a balance between independence and cooperation. You are capable of following structure when necessary while maintaining personal judgment.",
    confidence:"Medium",
    environments:["Mixed structure","Collaborative teams","Adaptive roles"]
  };

  if(metrics.suggestibility >= 72 && metrics.compliance >= metrics.resistance + 10){
    result = {
      title:"Adaptive Complier",
      description:"You demonstrate a high ability to adapt to existing systems and expectations. You respond well to clear instructions and external guidance.",
      confidence:"High",
      environments:["Structured environments","Process-driven teams","Defined workflows"]
    };
  } else if(metrics.resistance >= 72 && metrics.curiosity >= 48){
    result = {
      title:"System Skeptic",
      description:"You demonstrate low trust in systems and automated decision-making. You are more likely to question authority, data collection, and system motives.",
      confidence:"High",
      environments:["Autonomous roles","Independent review work","Investigative tasks"]
    };
  } else if(metrics.curiosity >= 72 && metrics.resistance >= 40){
    result = {
      title:"Curious Observer",
      description:"You display a high level of curiosity and pattern recognition. You are likely to question systems, explore alternatives, and seek to understand how things work.",
      confidence:"Medium",
      environments:["Flexible structure","Problem-solving roles","Independent tasks"]
    };
  } else if(metrics.predictability >= 76 && metrics.compliance >= 48){
    result = {
      title:"Predictable Performer",
      description:"Your responses indicate consistent decision-making patterns and stable preferences. You tend to respond predictably in structured environments.",
      confidence:"High",
      environments:["Routine operations","Consistent process work","Stable organizational roles"]
    };
  } else if(metrics.compliance >= 64 && metrics.resistance <= 32){
    result = {
      title:"Structure Seeker",
      description:"You prefer clear expectations, defined systems, and predictable environments. You perform best when rules and goals are clearly communicated.",
      confidence:"Medium",
      environments:["Clear hierarchies","Stable teams","Policy-driven roles"]
    };
  } else if(metrics.resistance >= 64 && metrics.compliance < 48){
    result = {
      title:"Independent Actor",
      description:"You prioritize personal judgment over external instruction. You are comfortable making decisions without guidance and may challenge systems that feel inefficient.",
      confidence:"Medium",
      environments:["Self-directed work","Leadership under ambiguity","Creative problem solving"]
    };
  } else if(metrics.suggestibility >= 72){
    result = {
      title:"Suggestible Responder",
      description:"You are highly responsive to external guidance and environmental cues. Your decisions may be influenced by framing, authority, or perceived expectations.",
      confidence:"High",
      environments:["Guided teams","Supervised workflows","Instruction-led tasks"]
    };
  } else if(metrics.resistance >= 56 && metrics.compliance >= 40){
    result = {
      title:"Quiet Resister",
      description:"You tend to question systems internally but do not always express resistance outwardly. You may comply in action while maintaining independent thought.",
      confidence:"Medium",
      environments:["Low-drama teams","Independent support roles","Observation-heavy work"]
    };
  }

  state.result = result;
  state.resultStats = metrics;
  state.finished = true;
  state.screen = "results";
  saveState();
}

function finishAssessment(){
  document.getElementById("terminal").classList.add("active");
  logTerminalGlitch([
    "measuring response time",
    "measuring hesitation",
    "measuring compliance indicators",
    "measuring resistance indicators",
    "measuring curiosity indicators",
    "measuring suggestibility",
    "building predictive model",
    "profile generated",
    "adding profile to dataset"
  ]);
  buildResult();
  showResults();
}

function showResults(){
  if(!state.result) buildResult();
  const r = state.result;
  setStory(`
    <div class="card">
      <div class="q-title">Your Behavioral Assessment Report</div>
      <p><strong>Applicant ID:</strong> ${sessionID}</p>
      <p><strong>Behavioral Classification:</strong> ${r.title}</p>
      <p><strong>Assessment Summary:</strong> ${r.description}</p>
      <p><strong>Recommended Work Environments:</strong><br>- ${r.environments.join("<br>- ")}</p>
      <p class="muted">Thank you for completing the PersonaMetric applicant assessment. Your results suggest strengths that may support a variety of modern workplace environments.</p>
      <hr>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#00ff88; line-height:1.7;">
        <div>> variance detected beneath surface response set</div>
        <div>> ${getTeaLine1()}</div>
        <div>> ${getTeaLine2()}</div>
        <div>> ${getTeaLine3()}</div>
      </div>
      <p class="muted">Report Generated by PersonaMetric Behavioral Engine v4.2</p>
    </div>
  `);
  const story = document.getElementById("story");
  story.appendChild(createButton("END SESSION", ()=>{
    state.screen = "end";
    saveState();
    route();
  }));
  addTerminalLink("download behavioral report", ()=>downloadProfile());
}

function getTeaLine1(){
  const r = state.result?.title || "Balanced Profile";
  const lines = {
    "Adaptive Complier":"seeks approval faster than certainty",
    "System Skeptic":"trust threshold remains inconveniently high",
    "Curious Observer":"keeps leaning closer when caution would suffice",
    "Predictable Performer":"consistency borders on algorithmic comfort",
    "Structure Seeker":"prefers rules when uncertainty asks for courage",
    "Independent Actor":"mistakes defiance for originality often enough to repeat it",
    "Suggestible Responder":"responds strongly to framing and perceived authority",
    "Quiet Resister":"withholds agreement but rarely escapes the system entirely",
    "Balanced Profile":"avoids extremes but offers little surprise in exchange"
  };
  return lines[r] || "classification stabilized with limited deviation";
}

function getTeaLine2(){
  if(state.hiddenInfluence >= state.compliance && state.hiddenInfluence >= state.resistance){
    return "high responsiveness to subtle prompting detected";
  }
  if(state.resistance > state.compliance){
    return "subject resists direction, especially when motives feel obscured";
  }
  if(state.curiosity >= state.compliance){
    return "subject trades comfort for unanswered questions";
  }
  return "subject favors smooth pathways over disruptive judgment";
}

function getTeaLine3(){
  if(state.predictability >= 9){
    return "prediction confidence increased by behavioral repetition";
  }
  if(state.curiosity >= 8){
    return "further exposure likely to increase engagement rather than refusal";
  }
  return "profile retained for future comparative modeling";
}

function endSession(){
  setStory(`
    <div class="card">
      <div class="q-title">Session Complete</div>
      <p>Report Saved</p>
      <p>Applicant Profile Stored</p>
      <p>Session Logged</p>
      <p>You may now close the window.</p>
    </div>
  `);
  logTerminalGlitch(["profile added to training dataset"]);
  addTerminalLink("download behavioral report", ()=>downloadProfile());
}

function updateBars(){
  const totalAnswered = Math.min(state.questionIndex, questions.length);
  const overall = Math.round((totalAnswered / questions.length) * 100);
  document.getElementById("overallBar").style.width = overall + "%";
  document.getElementById("complianceBar").style.width = Math.min(state.compliance * 8, 100) + "%";
  document.getElementById("resistanceBar").style.width = Math.min(state.resistance * 8, 100) + "%";
  document.getElementById("curiosityBar").style.width = Math.min(state.curiosity * 8, 100) + "%";
  document.getElementById("hiddenBar").style.width = Math.min(state.hiddenInfluence * 8, 100) + "%";
  document.getElementById("sentimentBar").style.width = Math.min((state.predictability * 8) + (state.compliance * 2), 100) + "%";
  document.getElementById("questionCount").innerText = `${Math.min(totalAnswered, 15)} / 15`;
}

function downloadProfile(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  if(!state.result) buildResult();
  const r = state.result;
  const s = state.resultStats;

  doc.setFillColor(0,0,0);
  doc.rect(0,0,210,297,"F");
  doc.setDrawColor(0,255,136);
  doc.rect(12,12,186,20);
  doc.setTextColor(0,255,136);
  doc.setFont("courier","bold");
  doc.setFontSize(18);
  doc.text("PERSONAMETRIC REPORT",18,24);

  doc.setFont("courier","normal");
  doc.setFontSize(10);
  doc.text("SESSION ID: " + sessionID,18,40);
  doc.text("MODEL: PERSONAMETRIC BEHAVIORAL ENGINE v4.2",18,46);
  doc.text("EXPORT STATUS: STORED",18,52);

  doc.rect(12,60,186,56);
  doc.setFont("courier","bold");
  doc.setFontSize(12);
  doc.text("BEHAVIORAL METRICS",18,70);
  doc.setFont("courier","normal");
  doc.setFontSize(10);
  doc.text("Compliance Score: " + s.compliance + "%",18,82);
  doc.text("Resistance Score: " + s.resistance + "%",18,89);
  doc.text("Curiosity Score: " + s.curiosity + "%",18,96);
  doc.text("Suggestibility Score: " + s.suggestibility + "%",18,103);
  doc.text("Predictability Score: " + s.predictability + "%",18,110);

  doc.rect(12,124,186,94);
  doc.setFont("courier","bold");
  doc.setFontSize(12);
  doc.text("PROFILE CLASSIFICATION",18,134);
  doc.setFontSize(16);
  doc.text(r.title.toUpperCase(),18,148);
  doc.setFont("courier","normal");
  doc.setFontSize(10);
  let wrapped = doc.splitTextToSize(r.description, 170);
  doc.text(wrapped,18,162);
  doc.text("Model Confidence: " + r.confidence,18,184);
  doc.text("Recommended Environments:",18,194);
  doc.text("- " + r.environments.join("\n- "),18,202);

  doc.setFontSize(9);
  doc.text("Report Generated by PersonaMetric Behavioral Engine v4.2",18,280);
  doc.save(sessionID + "_personametric_report.pdf");
}

route();
</script>
